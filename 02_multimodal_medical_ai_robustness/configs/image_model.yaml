experiment:
  name: se_resnet154_xray_baseline
  seed: 42


data:

  dataset: indiana_university_chest_xray

  train_split: 0.8

  image_size: 224

  mean:
    - 0.61
    - 0.61
    - 0.61

  std:
    - 0.24
    - 0.24
    - 0.24


model:

  architecture: se_resnet154

  pretrained: true

  num_classes: 1


training:

  epochs: 13

  batch_size: 128

  optimizer: Adam

  learning_rate: 0.0001


scheduler:

  name: ReduceLROnPlateau

  mode: min
